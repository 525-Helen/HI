<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#7a9e7e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>AI个性化饮食管理 Agent</title>
<style>
:root{
  --green:#7a9e7e;--green-d:#5d8463;--green-l:#e7f0e8;
  --bg:#f4f1e8;--surface:#ffffff;--text:#334033;--muted:#84908a;
  --line:#e4e6da;--warn:#e07a5f;--warn-l:#fbeae4;
  --radius:16px;--shadow:0 6px 20px rgba(60,80,60,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media(min-width:520px){.wrap{box-shadow:0 0 40px rgba(60,80,60,.12);min-height:100vh}}
/* ---------- header ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:20}
.head-in{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:var(--green-l);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:20px}
.brand .t{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-btn{background:var(--green-l);color:var(--green-d);border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.head-btn:active{opacity:.7}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--green-l);border:none;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.icon-btn:active{opacity:.7}
/* ---------- pages ---------- */
.page{display:none;flex:1;overflow-y:auto}
.page.active{display:flex;flex-direction:column}
/* ---------- profile form ---------- */
.form-page{justify-content:flex-start;padding:20px 18px 30px}
.form-title{font-size:20px;font-weight:700;margin:8px 0 4px}
.form-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)}
.field .req{color:var(--warn)}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--surface);color:var(--text)}
.inp:focus{outline:none;border-color:var(--green)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
.seg button:active{opacity:.85}
.radio-row{display:flex;gap:8px}
.radio-row label{flex:1;display:flex;align-items:center;justify-content:center;padding:11px 4px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;gap:6px}
.radio-row input{display:none}
.radio-row label.on{background:var(--green);border-color:var(--green);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.err-msg{display:none;background:var(--warn-l);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:12px;line-height:1.5}
.btn-primary{width:100%;padding:15px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-primary:disabled{opacity:.6}
.btn-primary:active{opacity:.85}
.save-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- chat ---------- */
.chat-page{background:var(--bg)}
#chat{flex:1;overflow-y:auto;padding:16px 14px 120px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.quick button{flex:none;padding:9px 13px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--green-d);font-size:13px;font-weight:600;cursor:pointer}
.quick button:active{background:var(--green-l)}
.msg{display:flex;margin-bottom:14px}
.msg .bubble{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.65;font-size:15px;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--green);color:#fff;border-bottom-right-radius:5px}
.msg.ai{justify-content:flex-start}
.msg.ai .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .bubble strong{font-weight:700}
.bubble .warn{color:var(--warn);font-weight:600}
.bubble .src{color:var(--green-d);font-style:italic}
.typing .bubble{color:var(--muted)}
.typing .dot{animation:blink 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err-toast{display:none;background:var(--warn-l);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13.5px;margin:0 0 12px;line-height:1.5}
/* ---------- input bar ---------- */
.inputbar{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.inp-row{max-width:460px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;max-height:120px;resize:none;background:var(--surface);color:var(--text)}
textarea:focus{outline:none;border-color:var(--green)}
.send{width:52px;height:52px;flex:none;border:none;border-radius:16px;background:var(--green);color:#fff;font-size:20px;cursor:pointer}
.send:disabled{opacity:.5}
.send:active{opacity:.8}
/* ---------- profile card ---------- */
.card-page{padding:22px 18px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 18px;box-shadow:var(--shadow)}
.card .row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px}
.card .row:last-child{border-bottom:none}
.card .k{color:var(--muted)}
.card .v{font-weight:600;max-width:62%;text-align:right}
.taglist{display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tag{background:var(--green-l);color:var(--green-d);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(40,52,40,.9);color:#fff;padding:11px 18px;border-radius:30px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <!-- ======= 建档 / 编辑档案页 ======= -->
  <div class="page form-page" id="pg-form">
    <header style="position:static;border-bottom:none;padding:6px 0;background:transparent"><div class="brand"><div class="logo">🥗</div><div><div class="t" id="formHeadTitle">创建私人饮食档案</div></div></div></header>
    <div class="form-title" id="formTitle">创建私人饮食档案</div>
    <div class="form-sub" id="formSub">先告诉我们身体情况、目标与饮食禁忌，之后每次记录和提醒都会更贴合你。所有信息仅用于为你计算与拦截，不会对外公开。</div>
    <div class="err-msg" id="formErr"></div>
    <form onsubmit="submitForm(event)">
      <div class="field"><label>性别 <span class="req">*</span></label>
        <div class="radio-row" id="genderRow">
          <label><input type="radio" name="gender" value="男"><span>男</span></label>
          <label><input type="radio" name="gender" value="女"><span>女</span></label>
        </div>
      </div>
      <div class="field"><label>年龄（岁）<span class="req">*</span></label><input class="inp" id="age" type="number" inputmode="numeric" min="10" max="100" placeholder="如 28"></div>
      <div class="field"><label>身高（cm）<span class="req">*</span></label><input class="inp" id="height" type="number" inputmode="decimal" min="120" max="230" placeholder="如 165"></div>
      <div class="field"><label>体重（kg）<span class="req">*</span></label><input class="inp" id="weight" type="number" inputmode="decimal" min="25" max="250" step="0.1" placeholder="如 54"></div>
      <div class="field"><label>当前目标 <span class="req">*</span>（单选）</label>
        <div class="radio-row" id="goalRow">
          <label><input type="radio" name="goal" value="减脂"><span>减脂</span></label>
          <label><input type="radio" name="goal" value="增肌"><span>增肌</span></label>
          <label><input type="radio" name="goal" value="维持"><span>维持</span></label>
        </div>
      </div>
      <div class="field"><label>日常活动水平 <span class="req">*</span></label>
        <div class="radio-row" id="actRow">
          <label><input type="radio" name="act" value="久坐"><span>久坐</span></label>
          <label><input type="radio" name="act" value="轻度"><span>轻度</span></label>
          <label><input type="radio" name="act" value="中度"><span>中度</span></label>
          <label><input type="radio" name="act" value="高度"><span>高度</span></label>
        </div>
      </div>
      <div class="field"><label>过敏原（可留空）</label><input class="inp" id="allergens" placeholder="如：花生、虾、牛奶（用顿号或逗号分隔）"></div>
      <div class="field"><label>忌口或不喜欢的食物（可留空）</label><input class="inp" id="dislikes" placeholder="如：香菜、肥肉（用顿号或逗号分隔）"></div>
      <div class="err-msg" id="formErr2" style="margin-top:0"></div>
      <button class="btn-primary" id="saveBtn" type="submit">保存并开始记录</button>
      <div class="save-hint" id="saveHint"></div>
    </form>
  </div>

  <!-- ======= 对话首页 ======= -->
  <div class="page chat-page" id="pg-chat">
    <header id="chatHead">
      <div class="head-in">
        <div class="brand"><div class="logo">🥗</div><div class="t">AI个性化饮食管理</div></div>
        <div style="display:flex;gap:8px">
          <button class="head-btn" onclick="newSession()">新会话</button>
          <button class="icon-btn" onclick="showProfile()" title="我的档案">👤</button>
        </div>
      </div>
    </header>
    <div class="err-toast" id="chatErr" onclick="this.style.display='none'"></div>
    <div id="chat"></div>
    <div class="chatpage-spacer"></div>
  </div>

  <!-- ======= 用户画像查看页 ======= -->
  <div class="page card-page" id="pg-card">
    <header style="position:static;border-bottom:none;padding:6px 0;background:transparent">
      <div class="head-in">
        <div class="brand"><div class="logo">👤</div><div class="t">我的档案</div></div>
        <button class="head-btn" onclick="showChat()">返回对话</button>
      </div>
    </header>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px">
      <div class="form-sub" style="margin:0">你的个性化饮食档案</div>
      <button class="head-btn" onclick="editProfile()">编辑档案</button>
    </div>
    <div class="card" id="profileCard"></div>
    <div style="margin-top:14px;text-align:center"><button class="head-btn" style="background:var(--green-l)" onclick="showChat()">返回对话</button></div>
  </div>

  <!-- ======= 底部输入区（对话页） ======= -->
  <div class="inputbar" id="inputbar">
    <div class="quick" id="quickRow">
      <button onclick="quickCmd('record')">🍽️ 记录一餐</button>
      <button onclick="quickCmd('query')">📊 查询今日摄入</button>
      <button onclick="quickCmd('knowledge')">📖 营养知识问答</button>
      <button onclick="quickCmd('modify')">✏️ 修改饮食记录</button>
    </div>
    <div class="inp-row">
      <textarea id="input" rows="1" placeholder="告诉我你吃了什么，或想问的问题…"></textarea>
      <button class="send" id="send" onclick="sendMsg()">➤</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 用户与会话管理 ================= */
var uid = localStorage.getItem('ag_uid');
if(!uid){ uid = 'u_' + Math.random().toString(36).slice(2,12) + Date.now().toString(36); localStorage.setItem('ag_uid', uid); }

function getRunId(){
  var r = sessionStorage.getItem('ag_run');
  if(!r){ r = 's_' + Math.random().toString(36).slice(2,12); sessionStorage.setItem('ag_run', r); }
  return r;
}
function nextRunId(){ var r='s_'+Math.random().toString(36).slice(2,12); sessionStorage.setItem('ag_run',r); return r; }

var profile = null;
function loadProfile(){ try{ profile = JSON.parse(localStorage.getItem('ag_profile')||'null'); }catch(e){ profile=null; } return profile; }
function saveProfile(p){ localStorage.setItem('ag_profile', JSON.stringify(p)); profile=p; }

/* chat history in sessionStorage per session */
function loadChat(){ try{ return JSON.parse(sessionStorage.getItem('ag_chat')||'[]'); }catch(e){ return []; } }
function saveChat(c){ sessionStorage.setItem('ag_chat', JSON.stringify(c)); }

/* ================= XSS / 渲染 ================= */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderAi(text){
  var e = esc(text);
  /* light markdown after escaping (safe) */
  e = e.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  /* 高亮 风险/提醒/来源 */
  e = e.replace(/(⚠️|🔔|🚫|🛡️)[^<]*(?=<br>|<strong>|$)/g, function(m){ return '<span class="warn">'+m+'</span>'; });
  e = e.replace(/来源/g,'<span class="src">来源</span>');
  e = e.replace(/doc_id:/g,'来源 ');
  /* bullets & newlines */
  e = e.split('\n').map(function(l){
    l = l.replace(/^\s*[-•]\s+/,'• ');
    l = l.replace(/^\s*(\d+)[.、)]\s+/,'$1) ');
    return l;
  }).join('<br>');
  return e;
}
function addMsg(role, raw){
  var chat=document.getElementById('chat');
  var d=document.createElement('div'); d.className='msg '+role;
  var b=document.createElement('div'); b.className='bubble';
  b.innerHTML = role==='user' ? esc(raw) : renderAi(raw);
  d.appendChild(b); chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

/* ================= Toast ================= */
var toastTimer;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2400); }

/* ================= 路由 ================= */
function show(id){ document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');}); document.getElementById(id).classList.add('active'); }

/* ================= 页面切换 ================= */
function showChat(){ renderMessages(); show('pg-chat'); setTimeout(function(){document.getElementById('input').focus();},60); }
function showProfileCard(){ return card(); }
function renderChatHeader(){}
function showProfile(){ showCard(); }

/* ================= 建档表单逻辑 ================= */
var radioRows=['genderRow','goalRow','actRow'];
radioRows.forEach(function(id){ initRadio(id); });
function initRadio(rowId){
  var row=document.getElementById(rowId);
  row.addEventListener('click', function(e){
    var label=e.target.closest('label');
    if(!label) return;
    var inp=label.querySelector('input[type=radio]');
    if(!inp) return;
    /* 拦截原生 label→radio 激活，避免与自定义选中逻辑冲突 */
    if(e.preventDefault) e.preventDefault();
    /* 严格单选：同一行内先清空其它选中，再选中目标（始终只存在一个选中项） */
    row.querySelectorAll('input').forEach(function(i){ i.checked=false; i.closest('label').classList.remove('on'); });
    inp.checked=true; label.classList.add('on');
  });
}
function getRadioVal(name){
  var el=document.querySelector('input[name="'+name+'"]:checked');
  return el?el.value:null;
}

function validate(){
  var age=parseFloat(document.getElementById('age').value);
  var h=parseFloat(document.getElementById('height').value);
  var w=parseFloat(document.getElementById('weight').value);
  if(!getRadioVal('gender')) return '请选择性别';
  if(isNaN(age)||age<10||age>100) return '请输入合法的年龄（10–100 岁）';
  if(isNaN(h)||h<120||h>230) return '请输入合法的身高（120–230 cm）';
  if(isNaN(w)||w<25||w>250) return '请输入合法的体重（25–250 kg）';
  if(!getRadioVal('goal')) return '请选择当前目标（减脂 / 增肌 / 维持）';
  if(!getRadioVal('act')) return '请选择日常活动水平';
  return null;
}
function buildFormObj(){
  return {
    gender:getRadioVal('gender'),
    age:parseInt(document.getElementById('age').value,10),
    height:parseInt(document.getElementById('height').value,10),
    weight:parseFloat(document.getElementById('weight').value),
    goal:getRadioVal('goal'),
    act:getRadioVal('act'),
    allergens:document.getElementById('allergens').value.trim(),
    dislikes:document.getElementById('dislikes').value.trim()
  };
}
function profilePrompt(p){
  return '请保存我的用户档案：性别'+p.gender+'，年龄'+p.age+'岁，身高'+p.height+'cm，体重'+p.weight+'kg，当前目标'+p.goal+'，活动水平'+p.act+'，过敏与忌口为：过敏原'+(p.allergens||'无')+'；忌口'+(p.dislikes||'无')+'。';
}

/* 保存到后端（Agent 持久化） */
function persistProfile(p){
  return fetch('/run',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-user-id':uid,'x-run-id':getRunId()},
    body:JSON.stringify({messages:[{role:'user',content:profilePrompt(p)}]})
  }).then(function(resp){
    if(!resp.ok) throw new Error('srv');
    return resp.json();
  }).then(function(data){
    var msgs=data.messages||[];
    var last='';
    for(var i=msgs.length-1;i>=0;i--){ var m=msgs[i]; if(m&&m.type==='ai'&&typeof m.content==='string'&&m.content.trim()){last=m.content.trim();break;} }
    return last;
  });
}

function submitForm(e){
  e.preventDefault();
  var err=validate();
  if(err){ showFormErr(err); return; }
  var p=buildFormObj();
  var saving=document.querySelector('.card-page, .form-page');
  var btn=document.getElementById('saveBtn');
  var hint=document.getElementById('saveHint');
  btn.disabled=true;
  hint.innerHTML='正在保存档案…';
  /* 先本地保存（据此判定“已建档”、刷新不重复建档） */
  saveProfile(p);
  persistProfile(p).then(function(aiResp){
    hint.innerHTML='档案已保存 ✓';
    toast('档案已保存');
    showChat();
    setTimeout(function(){ hint.innerHTML=''; },500);
  }).catch(function(){
    /* 失败：保留用户填写信息 + 重试提示 */
    hint.innerHTML='保存失败，请检查网络后重试。';
    btn.disabled=false;
    showFormErr('饮食助手暂时无法保存档案，请稍后重试。你填写的内容仍在，可直接再次点击保存。');
  });
}
function showFormErr(msg){
  var e1=document.getElementById('formErr'), e2=document.getElementById('formErr2');
  e1.style.display='block'; e1.textContent=msg;
  e2.style.display='block'; e2.textContent=msg;
}

/* ================= 档案查看 ================= */
function fmtTags(s){ if(!s) return '<span style="color:#a9b0aa">无</span>'; return '<span class="taglist">'+s.split(/[、,，;；\s]+/).map(function(t){ return t?'<span class="tag">'+esc(t)+'</span>':''; }).join('')+'</span>'; }
function showCard(){
  loadProfile();
  var card=document.getElementById('profileCard');
  if(!profile){
    card.innerHTML='<div class="row"><span class="k">档案</span><span class="v">尚未创建</span></div>';
  }else{
    card.innerHTML =
      '<div class="row"><span class="k">性别</span><span class="v">'+esc(profile.gender||'-')+'</span></div>'+
      '<div class="row"><span class="k">年龄</span><span class="v">'+(profile.age||'-')+' 岁</span></div>'+
      '<div class="row"><span class="k">身高</span><span class="v">'+(profile.height||'-')+' cm</span></div>'+
      '<div class="row"><span class="k">体重</span><span class="v">'+(profile.weight||'-')+' kg</span></div>'+
      '<div class="row"><span class="k">当前目标</span><span class="v">'+esc(profile.goal||'-')+'</span></div>'+
      '<div class="row"><span class="k">活动水平</span><span class="v">'+esc(profile.act||'-')+'</span></div>'+
      '<div class="row"><span class="k">过敏原</span><span class="v">'+fmtTags(profile.allergens)+'</span></div>'+
      '<div class="row"><span class="k">忌口</span><span class="v">'+fmtTags(profile.dislikes)+'</span></div>';
  }
  show('pg-card');
}

/* ================= 编辑档案 ================= */
function editProfile(){
  loadProfile();
  document.getElementById('formHeadTitle').textContent='编辑档案';
  document.getElementById('formTitle').textContent='编辑档案';
  document.getElementById('formSub').textContent='修改后，后续建议将按新档案生效。';
  document.getElementById('saveBtn').textContent='保存修改';
  // 回填
  if(profile){
    setRadio('gender', profile.gender||'');
    setRadio('goal', profile.goal||'');
    setRadio('act', profile.act||'');
    document.getElementById('age').value=profile.age||'';
    document.getElementById('height').value=profile.height||'';
    document.getElementById('weight').value=profile.weight||'';
    document.getElementById('allergens').value=profile.allergens||'';
    document.getElementById('dislikes').value=profile.dislikes||'';
  }
  show('pg-form');
}
function setRadio(name,val){
  var el=document.querySelector('input[name="'+name+'"][value="'+val+'"]');
  document.querySelectorAll('input[name="'+name+'"]').forEach(function(i){i.checked=false;i.closest('label').classList.remove('on');});
  if(el){ el.checked=true; el.closest('label').classList.add('on'); }
}
/* submitForm when editing: also notify Agent of update */
(function(){
  var orig=submitForm;
  submitForm=function(e){
    e.preventDefault();
    var isEdit = document.getElementById('formTitle').textContent==='编辑档案';
    if(!isEdit){ orig(e); return; }
    var err=validate(); if(err){ showFormErr(err); return; }
    var p=buildFormObj();
    var btn=document.getElementById('saveBtn');
    btn.disabled=true; document.getElementById('saveHint').innerHTML='正在更新档案…';
    saveProfile(p);
    persistProfile(p).then(function(){
      toast('档案已更新');
      showCard();
      setTimeout(function(){ document.getElementById('saveHint').innerHTML=''; },300);
    }).catch(function(){
      toast('保存失败，请稍后重试');
      btn.disabled=false;
    });
  };
})();

/* ================= 新会话 ================= */
function newSession(){
  nextRunId();
  saveChat([]);
  document.getElementById('chat').innerHTML='';
  showChat();
  addMsg('ai','已开启新会话。接下来想让我帮你记录一餐、查询今日摄入，还是解答营养问题？');
}

/* ================= 对话 ================= */
function sendToAgent(text, textarea){
  var sendBtn=document.getElementById('send');
  sendBtn.disabled=true;
  addMsg('user', text);
  saveChat(loadChat().concat([{role:'user',content:text}]));
  /* typing indicator */
  var chat=document.getElementById('chat');
  var tp=document.createElement('div'); tp.className='msg ai typing';
  tp.innerHTML='<div class="bubble">正在为您计算…</div>'; chat.appendChild(tp); chat.scrollTop=chat.scrollHeight;

  var ctrl=new AbortController();
  var timer=setTimeout(function(){ ctrl.abort(); }, 60000); /* 超时60s */

  function showErr(msg){ tp.remove(); var e=document.getElementById('chatErr'); e.textContent=msg; e.style.display='block'; setTimeout(function(){e.style.display='none';},6000); }

  fetch('/run',{
    method:'POST',
    signal:ctrl.signal,
    headers:{'Content-Type':'application/json','x-user-id':uid,'x-run-id':getRunId()},
    body:JSON.stringify({messages:[{role:'user',content:text}]})
  }).then(function(resp){
    if(!resp.ok) throw new Error('srv');
    return resp.json();
  }).then(function(data){
    clearTimeout(timer);
    tp.remove();
    var msgs=data.messages||[];
    var last=null;
    for(var i=msgs.length-1;i>=0;i--){ var m=msgs[i]; if(m&&m.type==='ai'&&typeof m.content==='string'&&m.content.trim()){ last=m.content.trim(); break; } }
    if(last){ addMsg('ai', last); saveChat(loadChat().concat([{role:'ai',content:last}])); }
    else { addMsg('ai','（未获取到内容，请换个说法重试）'); }
  }).catch(function(e){
    clearTimeout(timer);
    if(e.name==='AbortError'){ showErr('请求超时，请稍后重试。'); }
    else { showErr('饮食助手暂时无法连接，请稍后重试。'); }
    /* 失败不丢已输入内容：把用户消息放回输入框 */
    if(textarea){ textarea.value = textarea.value ? textarea.value : text; }
  }).finally(function(){
    document.getElementById('send').disabled=false;
  });
}
function sendMsg(){
  var ta=document.getElementById('input');
  if(document.getElementById('send').disabled) return; /* 请求期间避免重复发送 */
  var text=ta.value.trim();
  if(!text) return;
  ta.value='';
  sendToAgent(text, ta);
  ta.style.height='auto';
}

/* 快捷指令：填入或发送真实自然语言 */
function quickCmd(kind){
  var ta=document.getElementById('input');
  var map={
    'record':'我吃了：',
    'query':'查询今日摄入',
    'knowledge':'我想了解：',
    'modify':'帮我修改/更正一下我的饮食记录：'
  };
  ta.value=map[kind]; ta.focus();
  if(kind==='query'){ sendMsg(); } /* 查询直接发送 */
}

/* 输入框自适应 + 软键盘 */
var input=document.getElementById('input');
input.addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); }
});

/* ================= 消息渲染（含持久化历史） ================= */
function renderMessages(){
  var chat=document.getElementById('chat');
  chat.innerHTML='';
  var history=loadChat();
  if(!history.length){ addMsg('ai','你好，我是你的个性化饮食助手。告诉我你今天吃了什么（尽量带上份量），或直接问我营养与热量问题。'); return; }
  history.forEach(function(m){ addMsg(m.role, m.content); });
  chat.scrollTop=chat.scrollHeight;
}

/* ================= 启动 ================= */
function boot(){
  loadProfile();
  if(profile){ showChat(); }
  else { showForm(); }
}
function showForm(){
  // reset to create mode
  document.getElementById('formHeadTitle').textContent='创建私人饮食档案';
  document.getElementById('formTitle').textContent='创建私人饮食档案';
  document.getElementById('formSub').textContent='先告诉我们身体情况、目标与饮食禁忌，之后每次记录和提醒都会更贴合你。所有信息仅用于为你计算与拦截，不会对外公开。';
  document.getElementById('saveBtn').textContent='保存并开始记录';
  setRadio('gender','');setRadio('goal','');setRadio('act','');
  document.getElementById('age').value='';document.getElementById('height').value='';document.getElementById('weight').value='';
  document.getElementById('allergens').value='';document.getElementById('dislikes').value='';
  document.getElementById('saveBtn').disabled=false;
  document.getElementById('saveHint').innerHTML='';
  document.getElementById('formErr').style.display='none';
  document.getElementById('formErr2').style.display='none';
  show('pg-form');
}
boot();
</script>
